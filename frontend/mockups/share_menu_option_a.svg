<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3d3d"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#9BBB2E">OPTION A: Bottom Sheet with Action Tiles</text>
  <text x="410" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#999">showModalBottomSheet — native mobile pattern, works great on desktop too</text>

  <!-- ==================== MOBILE VIEW ==================== -->
  <text x="200" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ccc">Mobile</text>

  <!-- Phone frame -->
  <rect x="75" y="95" width="250" height="430" rx="24" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <rect x="85" y="115" width="230" height="390" rx="4" fill="#121212"/>
  <rect x="85" y="115" width="230" height="24" fill="#1e1e1e"/>
  <text x="100" y="131" font-family="sans-serif" font-size="10" fill="#888">9:41</text>

  <!-- Dimmed background -->
  <rect x="85" y="139" width="230" height="266" fill="#000" opacity="0.4"/>

  <!-- Bottom sheet -->
  <rect x="85" y="325" width="230" height="180" rx="16" fill="#2a2a2a" filter="url(#shadow2)"/>
  <!-- Drag handle -->
  <rect x="175" y="332" width="50" height="4" rx="2" fill="#555"/>

  <!-- Sheet title -->
  <text x="200" y="358" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e0e0e0">Share Lock</text>

  <!-- Action tile 1: Export to File -->
  <rect x="101" y="374" width="198" height="52" rx="12" fill="#333"/>
  <!-- Icon circle -->
  <circle cx="133" cy="400" r="16" fill="#9BBB2E" opacity="0.15"/>
  <text x="133" y="404" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9BBB2E">&#x2B07;</text>
  <!-- Text -->
  <text x="159" y="394" font-family="sans-serif" font-size="13" font-weight="500" fill="#e0e0e0">Export to File</text>
  <text x="159" y="409" font-family="sans-serif" font-size="10" fill="#888">Save encrypted lock to disk</text>

  <!-- Action tile 2: QR Code -->
  <rect x="101" y="434" width="198" height="52" rx="12" fill="#333"/>
  <!-- Icon circle -->
  <circle cx="133" cy="460" r="16" fill="#9BBB2E" opacity="0.15"/>
  <!-- QR icon approximation -->
  <rect x="125" y="452" width="6" height="6" fill="#9BBB2E"/>
  <rect x="133" y="452" width="6" height="6" fill="#9BBB2E"/>
  <rect x="125" y="460" width="6" height="6" fill="#9BBB2E"/>
  <rect x="133" y="460" width="6" height="6" fill="#9BBB2E"/>
  <!-- Text -->
  <text x="159" y="454" font-family="sans-serif" font-size="13" font-weight="500" fill="#e0e0e0">QR Code</text>
  <text x="159" y="469" font-family="sans-serif" font-size="10" fill="#888">Display scannable QR code</text>

  <!-- Positive callouts (mobile) -->
  <line x1="75" y1="400" x2="45" y2="390" stroke="#9BBB2E" stroke-width="1"/>
  <text x="6" y="385" font-family="sans-serif" font-size="9" fill="#9BBB2E">Large tap</text>
  <text x="6" y="396" font-family="sans-serif" font-size="9" fill="#9BBB2E">targets (52px)</text>

  <line x1="75" y1="460" x2="45" y2="470" stroke="#9BBB2E" stroke-width="1"/>
  <text x="6" y="468" font-family="sans-serif" font-size="9" fill="#9BBB2E">Thumb-</text>
  <text x="6" y="479" font-family="sans-serif" font-size="9" fill="#9BBB2E">friendly zone</text>

  <!-- ==================== DESKTOP VIEW ==================== -->
  <text x="610" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ccc">Desktop</text>

  <!-- Desktop frame -->
  <rect x="420" y="95" width="380" height="430" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="420" y="95" width="380" height="28" rx="8" fill="#2a2a2a"/>
  <circle cx="438" cy="109" r="5" fill="#ff5f57"/>
  <circle cx="454" cy="109" r="5" fill="#ffbd2e"/>
  <circle cx="470" cy="109" r="5" fill="#28c840"/>
  <text x="610" y="113" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">instacrypt</text>

  <!-- Screen -->
  <rect x="422" y="123" width="376" height="400" fill="#121212"/>

  <!-- Dimmed background -->
  <rect x="422" y="123" width="376" height="260" fill="#000" opacity="0.3"/>

  <!-- Bottom sheet (centered, constrained width) -->
  <rect x="475" y="303" width="270" height="200" rx="16" fill="#2a2a2a" filter="url(#shadow2)"/>
  <!-- Drag handle -->
  <rect x="585" y="310" width="50" height="4" rx="2" fill="#555"/>

  <!-- Sheet title -->
  <text x="610" y="338" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#e0e0e0">Share Lock</text>

  <!-- Action tile 1 -->
  <rect x="491" y="354" width="238" height="56" rx="12" fill="#333"/>
  <circle cx="523" cy="382" r="18" fill="#9BBB2E" opacity="0.15"/>
  <text x="523" y="387" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9BBB2E">&#x2B07;</text>
  <text x="553" y="376" font-family="sans-serif" font-size="13" font-weight="500" fill="#e0e0e0">Export to File</text>
  <text x="553" y="393" font-family="sans-serif" font-size="10" fill="#888">Save encrypted lock to disk</text>

  <!-- Action tile 2 -->
  <rect x="491" y="418" width="238" height="56" rx="12" fill="#333"/>
  <circle cx="523" cy="446" r="18" fill="#9BBB2E" opacity="0.15"/>
  <rect x="515" y="438" width="6" height="6" fill="#9BBB2E"/>
  <rect x="523" y="438" width="6" height="6" fill="#9BBB2E"/>
  <rect x="515" y="446" width="6" height="6" fill="#9BBB2E"/>
  <rect x="523" y="446" width="6" height="6" fill="#9BBB2E"/>
  <text x="553" y="440" font-family="sans-serif" font-size="13" font-weight="500" fill="#e0e0e0">QR Code</text>
  <text x="553" y="457" font-family="sans-serif" font-size="10" fill="#888">Display scannable QR code</text>

  <!-- Desktop callout -->
  <line x1="746" y1="382" x2="770" y2="370" stroke="#9BBB2E" stroke-width="1"/>
  <text x="772" y="365" font-family="sans-serif" font-size="9" fill="#9BBB2E">Hover states</text>
  <text x="772" y="376" font-family="sans-serif" font-size="9" fill="#9BBB2E">for desktop</text>

  <line x1="746" y1="446" x2="770" y2="456" stroke="#9BBB2E" stroke-width="1"/>
  <text x="772" y="455" font-family="sans-serif" font-size="9" fill="#9BBB2E">Same layout</text>
  <text x="772" y="466" font-family="sans-serif" font-size="9" fill="#9BBB2E">both platforms</text>
</svg>