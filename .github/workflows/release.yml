name: Release

# Build the Instacrypt desktop + Android apps and attach them to a published
# GitHub Release. Everything is built through the `flugo` CLI (Flutter UI + Go
# FFI backend). The desktop backend is a cgo c-shared lib with hardware-key
# support: challenge-response over HID via go-hid (vendors the hidapi C source —
# needs only libudev on Linux; IOKit/CoreFoundation frameworks on macOS; nothing
# at link time on Windows), FIDO2 via libfido2, and PC/SC (Nitrokey 3) via
# ebfe/scard enabled with GOFLAGS=-tags=pcsc. Android is GOOS-stubbed (pure-Go, no
# hardware libs). Same posture as ic-cli's release.yml.
#
# NOTE (first-cut / needs CI iteration): this workflow cannot be validated
# locally (no Flutter/macOS/Windows here). The highest-risk spots are marked
# `# RISK:` — expect to iterate on real runners, as ic-cli's workflow did.
#
# Trigger: publishing a Release via the web UI; workflow_dispatch re-runs against
# an existing tag for testing (make a pre-release first — "published" fires for
# pre-releases too).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Label for asset filenames + version stamp. Any string works for a test build — no real tag/release needed (publish only runs on an actual Release).'
        required: false
        default: dev
      platforms:
        description: 'OS builds to run — comma-separated (linux,macos,windows,android) or "all". Ignored on a real Release (always builds everything).'
        required: false
        default: all

permissions:
  contents: write

# TAG (e.g. v0.1.0) names the assets; VER (0.1.0) is stamped into the app.
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  FLUGO_VERSION: v0.1.10

jobs:
  # --- Linux amd64/arm64 -----------------------------------------------------
  # Built INSIDE an ubuntu:22.04 container (glibc 2.35) on a supported 24.04
  # runner, so the .tar.gz + .AppImage run on older distros (AppImageHub-friendly)
  # without pinning the deprecating `ubuntu-22.04` runner label.
  build-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux') }}
    name: build Linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      # appimagetool can't mount FUSE inside a container — run it extracted.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # Pin one stable tag for BOTH Linux arches: amd64 pulls the prebuilt SDK,
      # arm64 clones it (Flutter builds arm64 engine artifacts but doesn't
      # package them into releases_linux.json, so the action can't resolve
      # `stable` on arm64). A branch tip can drift off its tagged commit and
      # break flutter's `--depth 1` version detection — pin, bump deliberately.
      FLUTTER_VERSION: "3.47.2"
    steps:
      - name: Install toolchain (container is bare)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git curl unzip zip xz-utils file ca-certificates build-essential jq \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libudev-dev libfido2-dev libpcsclite-dev \
            libfuse2 desktop-file-utils librsvg2-bin imagemagick
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          # go.mod/go.sum live in backend/, not repo root — point the cache there
          # so setup-go stops warning "Dependencies file is not found".
          cache-dependency-path: backend/go.sum

      # amd64 has a prebuilt SDK archive the action resolves; arm64 does NOT
      # (Flutter builds arm64 engine artifacts but doesn't package them into
      # releases_linux.json), so the action errors "Unable to determine Flutter
      # version ... arm64". Clone the SDK for arm64 — precache pulls the real
      # arm64 desktop engine, which does exist. safe.directory '*' is already set
      # in the toolchain step (root in a container), so flutter's git version
      # probe won't abort under --depth 1.
      - name: Set up Flutter (amd64, prebuilt SDK)
        if: matrix.arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Flutter (arm64, git clone)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 -b "${FLUTTER_VERSION}" \
            https://github.com/flutter/flutter.git "${RUNNER_TEMP}/flutter"
          echo "${RUNNER_TEMP}/flutter/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH only affects LATER steps, so call flutter by full path here.
          "${RUNNER_TEMP}/flutter/bin/flutter" --version   # bootstrap + confirm the tag
          "${RUNNER_TEMP}/flutter/bin/flutter" precache --linux   # pull arm64 desktop engine

      - name: Install flugo CLI
        run: go install github.com/hkdb/flugo/cmd/flugo@${FLUGO_VERSION}

      - name: Stamp version
        run: bash .github/scripts/stamp-version.sh "${TAG#v}"

      - name: Build + package
        env:
          GOFLAGS: -tags=pcsc          # flugo's inner `go build` inherits this → enables the PC/SC (Nitrokey 3) backend
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p dist
          # tar.gz is the guaranteed Linux artifact — build + copy it FIRST so an
          # AppImage failure below can't cost us the tarball.
          flugo generate            # bridge.gen.* are gitignored — regenerate them
          flugo build linux --release
          flugo package linux
          TAR="$(find frontend/build build -name '*.tar.gz' | head -1)"
          test -n "$TAR"
          cp "$TAR" "dist/Instacrypt-App-Linux-${{ matrix.arch }}-${TAG}.tar.gz"
          # AppImage is best-effort (amd64; needs icons + appimagetool, and flugo
          # hardcodes -x86_64 so arm64 is expected to skip). Non-fatal.
          if ( flugo icons && flugo appimage && flugo build appimage ); then
            AI="$(find build frontend/build -name '*.AppImage' | head -1 || true)"
            [ -n "$AI" ] && cp "$AI" "dist/Instacrypt-App-Linux-${{ matrix.arch }}-${TAG}.AppImage"
          else
            echo "AppImage skipped/failed (expected on arm64 or missing tooling)"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: Linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # --- macOS amd64 (Intel) + arm64 (Apple Silicon) ---------------------------
  build-macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos') }}
    name: build macOS-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: macos-15-intel }  # last x86_64 image (to Aug 2027)
          - { arch: arm64, runner: macos-26 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          # go.mod/go.sum live in backend/, not repo root — point the cache there
          # so setup-go stops warning "Dependencies file is not found".
          cache-dependency-path: backend/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install native deps
        run: |
          brew untap aws/tap 2>/dev/null || true   # keep a security product's logs clean
          # ykpers is gone (chalresp is go-hid now, using the native IOHIDManager backend
          # on macOS — IOKit/CoreFoundation, no third-party lib). scard's PC/SC framework
          # is system-provided. Only libfido2 + openssl@3 need Homebrew.
          brew install pkg-config libfido2 openssl@3

      - name: Install flugo CLI
        run: go install github.com/hkdb/flugo/cmd/flugo@${FLUGO_VERSION}

      - name: Stamp version
        run: bash .github/scripts/stamp-version.sh "${TAG#v}"

      - name: Build + package (.dmg)
        env:
          GOFLAGS: -tags=pcsc          # enables PC/SC (Nitrokey 3) in flugo's inner `go build`
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Homebrew include/lib + keg-only openssl@3 aren't on the default search
          # path; point cgo at them so libfido2 doesn't hit go-libfido2's static
          # openssl@1.1 path (mirrors ic-cli). go-hid (IOKit/CoreFoundation) and scard
          # (-framework PCSC) declare their own cgo — no extra paths needed for them.
          BREW="$(brew --prefix)"; SSL="$(brew --prefix openssl@3)"
          export PKG_CONFIG_PATH="$BREW/lib/pkgconfig:$BREW/share/pkgconfig:$SSL/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export CGO_CFLAGS="-I$BREW/include -I$SSL/include"
          export CGO_LDFLAGS="-L$BREW/lib -L$SSL/lib"
          # Force single-arch per runner. `flutter build macos` defaults to a
          # UNIVERSAL (x86_64+arm64) build, but the non-native slice can't link
          # the single-arch Homebrew cgo libs — an x86_64 slice on an Apple
          # Silicon runner can't use arm64 /opt/homebrew libs (and vice-versa),
          # giving "ignoring file … found architecture 'arm64', required 'x86_64'
          # → Undefined symbols". FLUTTER_XCODE_ARCHS pins xcodebuild's ARCHS so
          # each runner builds ONLY its own arch → links its native libs. Result
          # is two single-arch DMGs, matching the -amd64/-arm64 asset split.
          case "${{ matrix.arch }}" in
            amd64) export FLUTTER_XCODE_ARCHS=x86_64 ;;
            arm64) export FLUTTER_XCODE_ARCHS=arm64 ;;
          esac
          flugo generate            # bridge.gen.* are gitignored — regenerate them
          flugo build macos --release
          APP="$(find frontend/build/macos -maxdepth 5 -name '*.app' -type d | head -1)"
          test -n "$APP"
          # Guard against shipping a hollow bundle (flugo used to fabricate an
          # empty <projectdir>.app holding only the Go dylib). A real bundle has
          # the Runner binary AND the injected backend dylib.
          test -d "$APP/Contents/MacOS" && [ -n "$(ls -A "$APP/Contents/MacOS")" ] \
            || { echo "::error::built .app is missing Contents/MacOS (hollow bundle): $APP"; exit 1; }
          test -f "$APP/Contents/Frameworks/libbackend.dylib" \
            || { echo "::error::built .app is missing Contents/Frameworks/libbackend.dylib: $APP"; exit 1; }
          echo "Packaging bundle: $(basename "$APP")"
          mkdir -p dist
          # RISK: unsigned/un-notarized — Gatekeeper will warn (document
          # `xattr -dr com.apple.quarantine`). Real signing needs an Apple account.
          # Stage the .app beside an /Applications symlink so the .dmg opens with
          # the familiar "drag Instacrypt → Applications" install layout.
          STAGE="$(mktemp -d)/Instacrypt"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Instacrypt" -srcfolder "$STAGE" -ov -format UDZO \
            "dist/Instacrypt-App-macOS-${{ matrix.arch }}-${TAG}.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: macOS-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # --- Windows amd64 (MINGW64) + arm64 (CLANGARM64) --------------------------
  # RISK (highest): the Go backend.dll is a cgo build needing mingw gcc/clang +
  # libfido2 (from MSYS2), while `flutter build windows` needs MSVC (from the
  # runner's Visual Studio). Both toolchains must be visible to `flugo build
  # windows`. go-hid links nothing at build time (runtime LoadLibrary of hid.dll)
  # and scard/pcsc is pure-Go (winscard.dll). This runs in pwsh with the MSYS2 bin
  # on PATH and CC set for cgo; expect to iterate here.
  build-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows') }}
    name: build windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: windows-2025,   msystem: MINGW64,     prefix: mingw-w64-x86_64,        cc: gcc }
          # NOTE: no windows-arm64 — Flutter ships no Windows-arm64 SDK, so
          # flutter-action can't resolve one. Windows-on-arm runs the amd64
          # build under x64 emulation.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          # go.mod/go.sum live in backend/, not repo root — point the cache there
          # so setup-go stops warning "Dependencies file is not found".
          cache-dependency-path: backend/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # MSYS2 provides the mingw C toolchain + hardware libs for the cgo backend.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit   # keep Windows PATH (flutter/MSVC) visible too
          install: >-
            ${{ matrix.prefix }}-${{ matrix.cc }}
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-libfido2
            ${{ matrix.prefix }}-ntldd-git
            perl

      - name: Install flugo CLI
        run: go install github.com/hkdb/flugo/cmd/flugo@$env:FLUGO_VERSION

      # Run the SAME stamp script as Linux/macOS/Android (via the msys2 bash + perl),
      # instead of a parallel PowerShell reimplementation, so the version logic can't
      # drift across platforms.
      - name: Stamp version
        shell: msys2 {0}
        run: bash .github/scripts/stamp-version.sh "${TAG#v}"

      - name: Build + installer (.exe)
        shell: pwsh
        env:
          GOFLAGS: -tags=pcsc          # enables PC/SC (Nitrokey 3) in flugo's inner `go build` (scard is pure-Go winscard)
        run: |
          # Put the MSYS2 mingw bin on PATH so cgo finds gcc/clang + the HW libs,
          # while flutter still sees MSVC from Visual Studio on the runner.
          $env:PATH = "$env:RUNNER_TEMP\msys64\${{ matrix.msystem }}\bin;$env:PATH"
          $env:CC = "${{ matrix.cc }}"
          $env:PATH = "$env:PATH;$(go env GOPATH)\bin"
          # pwsh does NOT halt on a native command's nonzero exit — check
          # $LASTEXITCODE so a build failure stops here instead of cascading into
          # a confusing "Release dir not found" further down.
          flugo generate            # bridge.gen.* are gitignored — regenerate them
          if ($LASTEXITCODE -ne 0) { throw "flugo generate failed ($LASTEXITCODE)" }
          flugo build windows --release
          if ($LASTEXITCODE -ne 0) { throw "flugo build windows failed ($LASTEXITCODE)" }
          # -Filter Release also matches CMake intermediates (…\ALL_BUILD.dir\Release);
          # the actual app output is …\<arch>\runner\Release — select that one.
          $rel = Get-ChildItem -Recurse -Directory frontend/build/windows -Filter Release |
                 Where-Object { $_.FullName -match 'runner\\Release$' } | Select-Object -First 1
          if (-not $rel) { throw "windows runner\Release dir not found" }
          # backend.dll is a MinGW cgo build; its dependency chain (libfido2,
          # openssl/libcrypto, cbor + the MinGW runtime libgcc_s/libwinpthread) is NOT
          # on a stock Windows box and Flutter doesn't bundle it — so the app's FFI
          # load of backend.dll fails and it launches to nothing. Copy backend.dll's
          # mingw64 deps next to it (ntldd -R = full recursive set); the installer's
          # Source line then packages them.
          $mingwBin = "$env:RUNNER_TEMP\msys64\${{ matrix.msystem }}\bin"
          $deps = & "$mingwBin\ntldd.exe" -R "$($rel.FullName)\backend.dll" |
                  ForEach-Object { if ($_ -match '=>\s+(\S+\.dll)') { $matches[1] } } |
                  Where-Object { $_ -match 'mingw64' } | Sort-Object -Unique
          if (-not $deps) { throw "ntldd resolved no mingw deps for backend.dll" }
          foreach ($d in $deps) { Copy-Item $d "$($rel.FullName)\" -Force; Write-Host "bundled $(Split-Path $d -Leaf)" }
          # RISK: Flutter Windows output is a folder; build a single installer .exe
          # via Inno Setup. Unsigned (SmartScreen will warn).
          choco install innosetup --no-progress -y
          $ver = "$env:TAG".TrimStart('v')
          $iss = @"
          [Setup]
          AppName=Instacrypt
          AppVersion=$ver
          DefaultDirName={autopf}\Instacrypt
          DefaultGroupName=Instacrypt
          OutputDir=dist
          OutputBaseFilename=Instacrypt-App-windows-${{ matrix.arch }}-$env:TAG
          ArchitecturesInstallIn64BitMode=x64compatible arm64
          SetupIconFile=frontend\windows\runner\resources\app_icon.ico
          UninstallDisplayIcon={app}\Instacrypt.exe
          [Files]
          Source: "$($rel.FullName)\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\Instacrypt"; Filename: "{app}\Instacrypt.exe"
          "@
          $iss | Set-Content build-installer.iss
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build-installer.iss

      - uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # --- Android APK (debug-signed for now) ------------------------------------
  # flugo build android builds the backend per-ABI with the NDK clang
  # (jniLibs/<abi>/libbackend.so) then `flutter build apk`. chalresp/fido2 are
  # pure-Go stubs on android, so no ykpers/libfido2 — NDK is the only native need.
  build-android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android') }}
    name: build android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          # go.mod/go.sum live in backend/, not repo root — point the cache there
          # so setup-go stops warning "Dependencies file is not found".
          cache-dependency-path: backend/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install flugo CLI
        run: go install github.com/hkdb/flugo/cmd/flugo@${FLUGO_VERSION}

      - name: Stamp version
        run: bash .github/scripts/stamp-version.sh "${TAG#v}"

      # Release signing: decode the keystore secret and write key.properties, which
      # build.gradle.kts reads (falling back to the debug keystore when absent). Only
      # on real releases (published releases + pre-releases) — a secret-less
      # workflow_dispatch build stays debug-signed so dev/test runs still work.
      - name: Set up Android release signing
        if: github.event_name == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::release build but ANDROID_KEYSTORE_BASE64 secret is unset — refusing to ship a debug-signed release"
            exit 1
          fi
          ks="$GITHUB_WORKSPACE/frontend/android/app/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
          cat > frontend/android/key.properties <<EOF
          storeFile=$ks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # flugo build android produces the APK (direct-download / self-hosted F-Droid).
      # flugo does NOT build an AAB, so we add `flutter build appbundle` for the Play
      # bundle — it reuses the backend .so flugo already placed in jniLibs (no cgo
      # rebuild). Both are release-signed via key.properties when present.
      - name: Build APK + AAB
        run: |
          set -eo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          flugo generate            # bridge.gen.* are gitignored — regenerate them
          flugo build android --release
          ( cd frontend && flutter build appbundle --release )
          mkdir -p dist
          APK="$(find frontend/build -name 'app-release.apk' | head -1)"
          test -n "$APK"
          cp "$APK" "dist/Instacrypt-App-android-${TAG}.apk"
          AAB="$(find frontend/build -name 'app-release.aab' | head -1)"
          test -n "$AAB"
          cp "$AAB" "dist/Instacrypt-App-android-${TAG}.aab"
          # Guard: on a real release the APK must NOT be debug-signed.
          if [ "${{ github.event_name }}" = "release" ]; then
            if "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" 2>/dev/null | grep -qi 'CN=Android Debug'; then
              echo "::error::release APK is debug-signed — check the ANDROID_KEYSTORE_* secrets"; exit 1
            fi
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  # --- Collect everything, checksum, attach to the release -------------------
  # No `if:` — runs only when ALL build jobs succeed (matrices are fail-fast:
  # false, so a job passes only if every arch in it passed). One failed target
  # skips publish, leaving no partial release.
  publish:
    name: Upload assets + checksums
    # Real Releases only — a manual workflow_dispatch is a build/test run, so it
    # never uploads (the built binaries are still available as run artifacts).
    if: ${{ github.event_name == 'release' }}
    needs: [build-linux, build-macos, build-windows, build-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum Instacrypt-App-* > checksums.txt
          echo "Built assets:"; cat checksums.txt

      - name: Upload to release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${TAG}" Instacrypt-App-* checksums.txt --repo "${{ github.repository }}" --clobber
