<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <defs>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#9BBB2E">CURRENT: Popup Menu</text>
  <text x="200" y="50" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#999">showMenu() — feels small on mobile, desktop-centric</text>

  <!-- Phone frame -->
  <rect x="75" y="70" width="250" height="410" rx="24" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <!-- Screen -->
  <rect x="85" y="90" width="230" height="370" rx="4" fill="#121212"/>
  <!-- Status bar -->
  <rect x="85" y="90" width="230" height="24" fill="#1e1e1e"/>
  <text x="100" y="106" font-family="sans-serif" font-size="10" fill="#888">9:41</text>

  <!-- Settings sheet background -->
  <rect x="85" y="180" width="230" height="280" rx="16" fill="#2a2a2a"/>
  <!-- Drag handle -->
  <rect x="175" y="186" width="50" height="4" rx="2" fill="#555"/>

  <!-- Identity row -->
  <rect x="97" y="206" width="206" height="48" rx="8" fill="#333"/>
  <circle cx="121" cy="230" r="14" fill="#3a3a3a"/>
  <text x="121" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9BBB2E">A</text>
  <text x="143" y="226" font-family="sans-serif" font-size="12" fill="#e0e0e0">Alice</text>
  <text x="143" y="240" font-family="sans-serif" font-size="9" fill="#888">PRIMARY</text>

  <!-- Share button (small) -->
  <rect x="255" y="218" width="36" height="24" rx="4" fill="transparent" stroke="#9BBB2E" stroke-width="1"/>
  <text x="273" y="234" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9BBB2E">Share</text>

  <!-- Popup menu (the problem) -->
  <g filter="url(#shadow1)">
    <rect x="200" y="246" width="115" height="80" rx="4" fill="#3a3a3a"/>
    <!-- Item 1 -->
    <text x="218" y="272" font-family="sans-serif" font-size="10" fill="#bbb">Export to File</text>
    <!-- Divider -->
    <line x1="205" y1="282" x2="310" y2="282" stroke="#555" stroke-width="0.5"/>
    <!-- Item 2 -->
    <text x="218" y="308" font-family="sans-serif" font-size="10" fill="#bbb">QR Code</text>
  </g>

  <!-- Problem callouts -->
  <line x1="320" y1="260" x2="340" y2="240" stroke="#ff6b6b" stroke-width="1"/>
  <text x="342" y="232" font-family="sans-serif" font-size="8" fill="#ff6b6b">Tiny tap</text>
  <text x="342" y="242" font-family="sans-serif" font-size="8" fill="#ff6b6b">targets</text>

  <line x1="320" y1="290" x2="345" y2="300" stroke="#ff6b6b" stroke-width="1"/>
  <text x="342" y="310" font-family="sans-serif" font-size="8" fill="#ff6b6b">No visual</text>
  <text x="342" y="320" font-family="sans-serif" font-size="8" fill="#ff6b6b">hierarchy</text>

  <line x1="200" y1="270" x2="70" y2="270" stroke="#ff6b6b" stroke-width="1"/>
  <text x="20" y="264" font-family="sans-serif" font-size="8" fill="#ff6b6b">Floats</text>
  <text x="20" y="274" font-family="sans-serif" font-size="8" fill="#ff6b6b">awkwardly</text>
  <text x="20" y="284" font-family="sans-serif" font-size="8" fill="#ff6b6b">on mobile</text>
</svg>