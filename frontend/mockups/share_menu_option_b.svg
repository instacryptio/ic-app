<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#9BBB2E">OPTION B: Adaptive — Bottom Sheet (Mobile) / Dialog (Desktop)</text>
  <text x="410" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#999">Platform-aware: native bottom sheet on mobile, centered dialog on desktop</text>

  <!-- ==================== MOBILE VIEW ==================== -->
  <text x="200" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ccc">Mobile — Bottom Sheet</text>

  <!-- Phone frame -->
  <rect x="75" y="95" width="250" height="430" rx="24" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <rect x="85" y="115" width="230" height="390" rx="4" fill="#121212"/>
  <rect x="85" y="115" width="230" height="24" fill="#1e1e1e"/>
  <text x="100" y="131" font-family="sans-serif" font-size="10" fill="#888">9:41</text>

  <!-- Dimmed background -->
  <rect x="85" y="139" width="230" height="266" fill="#000" opacity="0.4"/>

  <!-- Bottom sheet -->
  <rect x="85" y="325" width="230" height="180" rx="16" fill="#2a2a2a" filter="url(#shadow3)"/>
  <rect x="175" y="332" width="50" height="4" rx="2" fill="#555"/>

  <!-- Sheet title row with close button -->
  <text x="105" y="358" font-family="sans-serif" font-size="13" font-weight="600" fill="#e0e0e0">Share Lock</text>
  <circle cx="295" cy="352" r="12" fill="#3a3a3a"/>
  <text x="295" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">x</text>

  <!-- Action tile 1: Export to File — card style with icon on left -->
  <rect x="101" y="374" width="198" height="52" rx="12" fill="#333"/>
  <rect x="109" y="382" width="36" height="36" rx="10" fill="#9BBB2E" opacity="0.12"/>
  <text x="127" y="405" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9BBB2E">&#x1F4BE;</text>
  <text x="155" y="395" font-family="sans-serif" font-size="13" font-weight="500" fill="#e0e0e0">Export to File</text>
  <text x="155" y="410" font-family="sans-serif" font-size="10" fill="#888">Save to disk</text>
  <!-- Chevron -->
  <text x="287" y="402" font-family="sans-serif" font-size="14" fill="#555">&#x203A;</text>

  <!-- Action tile 2: QR Code -->
  <rect x="101" y="434" width="198" height="52" rx="12" fill="#333"/>
  <rect x="109" y="442" width="36" height="36" rx="10" fill="#9BBB2E" opacity="0.12"/>
  <!-- QR mini icon -->
  <rect x="119" y="453" width="5" height="5" rx="1" fill="#9BBB2E"/>
  <rect x="126" y="453" width="5" height="5" rx="1" fill="#9BBB2E"/>
  <rect x="119" y="460" width="5" height="5" rx="1" fill="#9BBB2E"/>
  <rect x="126" y="460" width="5" height="5" rx="1" fill="#9BBB2E"/>
  <rect x="133" y="460" width="3" height="3" rx="1" fill="#9BBB2E" opacity="0.5"/>
  <text x="155" y="457" font-family="sans-serif" font-size="13" font-weight="500" fill="#e0e0e0">QR Code</text>
  <text x="155" y="472" font-family="sans-serif" font-size="10" fill="#888">Scannable code</text>
  <text x="287" y="464" font-family="sans-serif" font-size="14" fill="#555">&#x203A;</text>

  <!-- ==================== DESKTOP VIEW ==================== -->
  <text x="610" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ccc">Desktop — Centered Dialog</text>

  <!-- Desktop frame -->
  <rect x="420" y="95" width="380" height="430" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <rect x="420" y="95" width="380" height="28" rx="8" fill="#2a2a2a"/>
  <circle cx="438" cy="109" r="5" fill="#ff5f57"/>
  <circle cx="454" cy="109" r="5" fill="#ffbd2e"/>
  <circle cx="470" cy="109" r="5" fill="#28c840"/>
  <text x="610" y="113" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">instacrypt</text>
  <rect x="422" y="123" width="376" height="400" fill="#121212"/>

  <!-- Dimmed background -->
  <rect x="422" y="123" width="376" height="400" fill="#000" opacity="0.4"/>

  <!-- Centered dialog -->
  <rect x="490" y="230" width="240" height="200" rx="16" fill="#2a2a2a" filter="url(#shadow3)"/>

  <!-- Dialog title -->
  <text x="610" y="260" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#e0e0e0">Share Lock</text>

  <!-- Two action cards side by side -->
  <!-- Card 1: File -->
  <rect x="506" y="278" width="102" height="100" rx="12" fill="#333"/>
  <rect x="530" y="294" width="54" height="40" rx="10" fill="#9BBB2E" opacity="0.12"/>
  <text x="557" y="320" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#9BBB2E">&#x2B07;</text>
  <text x="557" y="354" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#e0e0e0">Export File</text>
  <text x="557" y="368" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888">Save to disk</text>

  <!-- Card 2: QR -->
  <rect x="614" y="278" width="102" height="100" rx="12" fill="#333"/>
  <rect x="638" y="294" width="54" height="40" rx="10" fill="#9BBB2E" opacity="0.12"/>
  <!-- QR icon -->
  <rect x="655" y="305" width="8" height="8" rx="1" fill="#9BBB2E"/>
  <rect x="665" y="305" width="8" height="8" rx="1" fill="#9BBB2E"/>
  <rect x="655" y="315" width="8" height="8" rx="1" fill="#9BBB2E"/>
  <rect x="665" y="315" width="8" height="8" rx="1" fill="#9BBB2E"/>
  <text x="665" y="354" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#e0e0e0">QR Code</text>
  <text x="665" y="368" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888">Scan to share</text>

  <!-- Cancel button -->
  <rect x="542" y="394" width="136" height="28" rx="8" fill="transparent" stroke="#555" stroke-width="1"/>
  <text x="610" y="413" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#999">Cancel</text>

  <!-- Callouts -->
  <line x1="490" y1="330" x2="440" y2="330" stroke="#9BBB2E" stroke-width="1"/>
  <text x="420" y="320" font-family="sans-serif" font-size="9" fill="#9BBB2E" text-anchor="end">Grid layout</text>
  <text x="420" y="331" font-family="sans-serif" font-size="9" fill="#9BBB2E" text-anchor="end">uses desktop</text>
  <text x="420" y="342" font-family="sans-serif" font-size="9" fill="#9BBB2E" text-anchor="end">space well</text>

  <line x1="75" y1="434" x2="45" y2="434" stroke="#9BBB2E" stroke-width="1"/>
  <text x="6" y="428" font-family="sans-serif" font-size="9" fill="#9BBB2E">Swipe to</text>
  <text x="6" y="439" font-family="sans-serif" font-size="9" fill="#9BBB2E">dismiss</text>
</svg>